version: '3.4'

services:
  walletapp.db:
    container_name: walletapp.db
    hostname: walletapp.db
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Passw0rd'
      MSSQL_DATA_DIR: /var/opt/mssql/data
      MSSQL_PID: 'Developer'
      MSSQL_TCP_PORT: 1433
    ports:
      - "1433:1433"
    volumes:
      - ./data:/var/opt/mssql/data
      - ./log:/var/opt/mssql/log
      - ./secrets:/var/opt/mssql/secrets
  walletapp.api:
    image: ${DOCKER_REGISTRY-}walletappapi
    build:
      context: .
      dockerfile: WalletApp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "8000:80"
  walletapp.ui:
    image: ${DOCKER_REGISTRY-}walletappui
    build:
      context: ../wallet-app-ui
      dockerfile: Dockerfile
    environment:
      REACT_ENV: "production"
      PORT_HTTP: 5000
      PORT_HTTPS: 5001
    ports:
      - "3000:3000"
