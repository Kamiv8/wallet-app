version: '3.4'

services:
  walletapp.db:
    container_name: db
    hostname: walletapp.db
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Passw0rd
    ports:
      - "8002:1433"
    volumes:
      - ./data:/var/opt/mssql/data
      - ./log:/var/opt/mssql/log
      - ./secrets:/var/opt/mssql/secrets
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P "Passw0rd" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
  walletapp.api:
    image: walletapp.api
    container_name: api
    build:
      context: .
      dockerfile: WalletApp.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8000
      - ASPNETCORE_HTTPS_PORTS=8001
      - ASPNETCORE_Kestrel__Certificates__Default__Password=123
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/wallet.pfx
    volumes:
      - ~/.aspnet/https:/https:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      walletapp.db:
        condition: service_healthy
  walletapp.ui:
    container_name: client
    image: walletapp.client
    build:
      context: ../wallet-app-ui
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        REACT_APP_PORT_HTTPS: 8001
        REACT_APP_PORT_HTTP: 8000
    ports:
      - "8003:3000"
    depends_on:
      - walletapp.api