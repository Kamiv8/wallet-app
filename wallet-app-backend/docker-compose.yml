version: '3.4'

services:
  walletapp.db:
    container_name: walletapp.db
    hostname: walletapp.db
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Passw0rd'
      MSSQL_DATA_DIR: /var/opt/mssql/data
      MSSQL_PID: 'Developer'
      MSSQL_TCP_PORT: 1433
    restart: always
    networks:
      - networkApp
    ports:
      - "8003:1433"
    volumes:
      - ./data:/var/opt/mssql/data
      - ./log:/var/opt/mssql/log
      - ./secrets:/var/opt/mssql/secrets
  walletapp.api:
    image: ${DOCKER_REGISTRY-}walletappapi
    build:
      context: .
      dockerfile: WalletApp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
    networks:
      - networkApp
    ports:
      - "8000:80"
  walletapp.ui:
    image: ${DOCKER_REGISTRY-}walletappui
    build:
      context: ../wallet-app-ui
      dockerfile: Dockerfile
    volumes:
      - '.:/app'
      - '/app/node_modules'
    
    environment:
      CHOKIDAR_USEPOLLING: true
      REACT_ENV: "production"
      PORT_HTTP: 8000
      PORT_HTTPS: 80
    networks:
      - networkApp
    ports:
      - "8002:3000"
networks:
  networkApp: